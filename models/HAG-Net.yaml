# HAG-Net for fire and smoke detection
nc: 2

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, DMMM, [64]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, DMMM, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, DMMM, [256]]
  - [-1, 1, SPPF, [256, 5]]
  - [-1, 2, C2PSA, [256]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, CAFM, []]

  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 1, Conv, [64, 1, 1]]
  - [-1, 1, CAFM, []]

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, CAFM, []]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, CAFM, []]

  - [[17, 21, 25], 1, GradientAwareDecoupledDetectionHead, [nc, 64]]
